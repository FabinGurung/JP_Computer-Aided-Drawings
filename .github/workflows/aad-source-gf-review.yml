name: AAD Source Ground Floor Review QA
on:
  pull_request:
    paths:
      - "public/assets/js/aad-source-ground-floor.mjs"
      - "public/assets/js/aad-m70-plinth-bridge.mjs"
      - "public/assets/js/aad-m23-governed-stages.mjs"
      - "public/assets/js/aad-m24-user-reviewed-preview.mjs"
      - "public/data/projects/narayani-parajuli/aad-user-qa-decisions-v1.json"
      - "public/projects/narayani-parajuli/aad-qa-preview/**"
      - "tools/site/aad-m24-user-qa-*.mjs"
      - "public/stages/m60/**"
      - "public/stages/m40/**"
      - "public/stages/v03/**"
      - "public/assets/js/aad-source-svg-navigation.mjs"
      - "public/stages/m70/**"
      - "public/data/projects/narayani-parajuli/aad-source-stage-links-v1.json"
      - "public/assets/js/aad-source-coordinate-picking.mjs"
      - "public/data/projects/narayani-parajuli/aad-source-gf-review-v1.json"
      - "cad/aad/source-review/**"
      - "public/projects/narayani-parajuli/aad-source-review/**"
      - "tools/site/aad-source-gf-review-*.mjs"
      - "vite.config.ts"
      - ".github/workflows/aad-source-gf-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Original DXF candidate provenance and geometry contract
        run: node tools/site/aad-source-gf-review-smoke.mjs
      - name: Immutable-source fingerprint and M24 user review regression
        run: node tools/site/aad-m24-user-qa-smoke.mjs
      - name: Build the common AAD source-preview engine under the real Pages base
        run: |
          npm run build -- --base=/JP_Computer-Aided-Drawings/
          test -s dist/cad/aad/source-review/index.html
          test -s dist/data/projects/narayani-parajuli/aad-source-gf-review-v1.json
          test -s dist/data/projects/narayani-parajuli/aad-source-stage-links-v1.json
          test -s dist/data/projects/narayani-parajuli/aad-user-qa-decisions-v1.json
          test -s dist/projects/narayani-parajuli/aad-qa-preview/index.html
          test -s dist/stages/m70/stage-data.json
          test -s dist/stages/m70/meta.json
          test -s dist/stages/m60/stage-data.json
          test -s dist/stages/m40/stage-data.json
          test -s dist/stages/v03/stage-data.json
          test -s dist/projects/narayani-parajuli/aad-source-review/index.html
      - name: Install Chromium browser QA
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
      - name: Preview, 2D/3D coordinate proof and exception inspection
        run: |
          (npm run preview -- --host 127.0.0.1 --port 5202 --base=/JP_Computer-Aided-Drawings/ >/tmp/aad-source-preview-vite.log 2>&1 &)
          for i in $(seq 1 35); do
            curl -fsS http://127.0.0.1:5202/JP_Computer-Aided-Drawings/cad/aad/source-review/ >/dev/null && break
            sleep 2
          done
          AAD_SOURCE_REVIEW_URL=http://127.0.0.1:5202/JP_Computer-Aided-Drawings/projects/narayani-parajuli/aad-source-review/ node tools/site/aad-source-gf-review-browser-smoke.mjs
          AAD_M24_QA_URL=http://127.0.0.1:5202/JP_Computer-Aided-Drawings/projects/narayani-parajuli/aad-qa-preview/ node tools/site/aad-m24-user-qa-browser-smoke.mjs
      - name: Preserve visual source-review proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narayani-source-gf-branch-review
          path: |
            /tmp/aad-narayani-source-gf-review.png
            /tmp/aad-narayani-m24-user-qa-browser.png
          if-no-files-found: ignore
