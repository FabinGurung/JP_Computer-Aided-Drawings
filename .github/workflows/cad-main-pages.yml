name: CAD Main GitHub Pages (validated CAD publishing)
on:
  push:
    branches: [main]
    paths:
      - "cad/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "scripts/copy-ifc-wasm.mjs"
      - "index.html"
      - ".github/workflows/cad-main-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cad-main-production-pages
  cancel-in-progress: false
jobs:
  validate-and-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "npm"}
      - run: npm ci
      - run: npm run build -- --base=/JP_Computer-Aided-Drawings/
      - run: python tools/site/check_public_routes.py dist
      - run: |
          test -s dist/cad/index.html
          test -s dist/cad/demo.json
          test -s dist/cad/web-ifc.wasm
          echo "FIVE_ENGINE_BROWSER_PUBLICATION_GATE_PASS"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
  deploy:
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
