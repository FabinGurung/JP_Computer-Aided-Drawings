name: CAD Main GitHub Pages (validated CAD publishing)
on:
  push:
    branches: [main]
    paths:
      - "cad/**"
      - "public/**"
      - "tools/site/check_public_routes.py"
      - "tools/site/cad-aad-linked-smoke.mjs"
      - "tools/site/aad-narayani-browser-smoke.mjs"
      - "tools/site/aad-building-build.mjs"
      - "tools/site/aad-ifc-independent-check.py"
      - "tools/site/aad-building-browser-smoke.mjs"
      - "tools/site/aad-unified-workspace-smoke.mjs"
      - "tools/site/aad-narayani-source-smoke.mjs"
      - "tools/site/cad-unified-shell-smoke.mjs"
      - "backend/cad_bridge/design_*.py"
      - "design_jobs/synthetic/**"
      - "tools/site/cad-m08-verify.py"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "scripts/copy-ifc-wasm.mjs"
      - "index.html"
      - ".github/workflows/cad-main-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cad-main-production-pages
  cancel-in-progress: false
jobs:
  validate-and-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "npm"}
      - run: npm ci
      - run: npm run build -- --base=/JP_Computer-Aided-Drawings/
      - run: python tools/site/check_public_routes.py dist
      - name: Build deterministic Narayani IFC4 and unified AAD multistorey model
        run: node tools/site/aad-building-build.mjs
      - name: Validate source-authored Narayani AAD project adapter
        run: node tools/site/aad-narayani-source-smoke.mjs
      - name: Verify unified editable building state and IFC synchronization
        run: node tools/site/aad-unified-workspace-smoke.mjs
      - name: Pre-publish visual acceptance on built Pages bundle
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
          (npm run preview -- --host 127.0.0.1 --port 5191 --base=/JP_Computer-Aided-Drawings/ > /tmp/cad-release-preview.log 2>&1 &)
          for i in $(seq 1 35); do curl -fsS http://127.0.0.1:5191/JP_Computer-Aided-Drawings/cad/aad/ >/dev/null && break; sleep 2; done
          CAD_AAD_URL=http://127.0.0.1:5191/JP_Computer-Aided-Drawings/cad/aad/ node tools/site/cad-aad-linked-smoke.mjs
          AAD_PROJECT_URL=http://127.0.0.1:5191/JP_Computer-Aided-Drawings/projects/narayani-parajuli/aad/ node tools/site/aad-narayani-browser-smoke.mjs
          AAD_BUILDING_URL=http://127.0.0.1:5191/JP_Computer-Aided-Drawings/cad/aad/multistorey/ node tools/site/aad-building-browser-smoke.mjs
      - name: Save render verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-pages-prepublish-render-proof
          path: |
            /tmp/cad-aad-daylight-*.png
            /tmp/cad-aad-narayani-dxf.png
            /tmp/cad-aad-building-*.png
          if-no-files-found: ignore
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install pinned geometry engines for Pages build
        run: python -m pip install -r backend/requirements.txt
      - name: Independently validate IFC4 round-trip before publication
        run: python tools/site/aad-ifc-independent-check.py
      - name: GitHub-hosted machine generates synthetic demo plan and IFC/STEP/DXF
        run: |
          python -m unittest backend.tests.test_design_machine -v
          python -m backend.cad_bridge.design_cli --job design_jobs/synthetic/m08_demo.job.json --repo-root . --out dist/cad/jobs/m08-demo
          python tools/site/cad-m08-verify.py --out dist/cad/jobs/m08-demo --job design_jobs/synthetic/m08_demo.job.json
          test -s dist/cad/jobs/m08-demo/index.html
          test -s dist/cad/jobs/m08-demo/manifest.json
          echo "M08_PAGES_MACHINE_GENERATED_SOURCE_HASH_QA_PASS"
      - run: |
          test -s dist/cad/index.html
          test -s dist/cad/demo.json
          test -s dist/cad/web-ifc.wasm
          echo "FIVE_ENGINE_BROWSER_PUBLICATION_GATE_PASS"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
  deploy:
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
