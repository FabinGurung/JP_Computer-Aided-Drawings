name: CAD Main GitHub Pages (validated CAD publishing)
on:
  # Always publish the exact audited main commit; never publish PR head code.
  workflow_run:
    workflows: ["CAD Unified Website Staging QA"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cad-main-production-pages
  cancel-in-progress: false
jobs:
  validate-and-build:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "npm"}
      - run: npm ci
      - name: Ashok REV04 source admission and architecture-only template QA
        run: |
          node tools/site/ashok-rev04-smoke.mjs
          python tools/site/aad-build-code-register.py
          git diff --exit-code -- public/data/codes/nepal-pokhara.json
          node tools/site/aad-code-document-smoke.mjs
          python tools/site/ashok-build-coordinated.py
          git diff --exit-code -- 'public/data/projects/ashok-adhikari/*qa02.json'
          node tools/site/ashok-qa02-smoke.mjs
          node tools/site/ashok-v2-services-smoke.mjs
          node tools/site/ashok-qa02-ifc.mjs
      - name: M26 immutable source-backed 2D/3D/table/IFC acceptance
        run: node tools/site/aad-m26-canonical-source-integration-smoke.mjs
      - name: M27 engineering source-preservation and open-HOLD gate
        run: node tools/site/aad-m27-hold-gate.mjs
      - name: M28 owner verification and source-derived H3/I3-CF1 footprint check
        run: node tools/site/aad-m28-reconciliation-smoke.mjs
      - name: M29 DXF source midpoint and upper-floor projection evidence acceptance
        run: node tools/site/aad-m29-datum-projection-smoke.mjs
      - name: M30 read-only original DXF source inventory and upper-floor sheet contract
        run: node tools/site/aad-m30-source-evidence-smoke.mjs
      - name: M31 owner decision debt reconciliation and source-aware structural diagnostics
        run: node tools/site/aad-m31-current-debt-gate.mjs
      - name: Generate verified public synthetic AI-to-AAD package from versioned specification
        run: |
          node tools/site/aad-ai-pipeline-smoke.mjs
          node tools/site/aad-ai-build-all.mjs --check
          node tools/site/aad-ai-build-all.mjs --publish
          for spec in design_jobs/synthetic/aad-ai-two-storey.json design_jobs/ai-projects/*.json; do
            test -f "$spec" || continue
            slug=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).project.slug)' "$spec")
            node tools/site/aad-validate-project.mjs "public/data/projects/$slug/aad-building-v1.json"
          done
      - run: npm run build -- --base=/JP_Computer-Aided-Drawings/
      - run: python tools/site/check_public_routes.py dist
      - name: Build deterministic Narayani IFC4 and unified AAD multistorey model
        run: node tools/site/aad-building-build.mjs
      - name: Verify generic AI-authored project contract on published AAD data
        run: node tools/site/aad-validate-project.mjs public/data/projects/narayani-parajuli/aad-building-v1.json
      - name: Validate source-authored Narayani AAD project adapter
        run: node tools/site/aad-narayani-source-smoke.mjs
      - name: Verify unified editable building state and IFC synchronization
        run: node tools/site/aad-unified-workspace-smoke.mjs
      - name: Verify advanced AAD topology drafting and four-room IFC non-regression
        run: node tools/site/aad-topology-smoke.mjs
      - name: Pre-publish visual acceptance on built Pages bundle
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
          (npm run preview -- --host 127.0.0.1 --port 5191 --base=/JP_Computer-Aided-Drawings/ > /tmp/cad-release-preview.log 2>&1 &)
          for i in $(seq 1 35); do curl -fsS http://127.0.0.1:5191/JP_Computer-Aided-Drawings/cad/aad/ >/dev/null && break; sleep 2; done
          CAD_AAD_URL=http://127.0.0.1:5191/JP_Computer-Aided-Drawings/cad/aad/legacy/ node tools/site/cad-aad-linked-smoke.mjs
          AAD_PROJECT_URL=http://127.0.0.1:5191/JP_Computer-Aided-Drawings/projects/narayani-parajuli/aad/ node tools/site/aad-narayani-browser-smoke.mjs
          AAD_M26_PROJECT_URL=http://127.0.0.1:5191/JP_Computer-Aided-Drawings/projects/narayani-parajuli/aad/ node tools/site/aad-m26-primary-studio-browser-smoke.mjs
          AAD_M29_PROJECT_URL=http://127.0.0.1:5191/JP_Computer-Aided-Drawings/projects/narayani-parajuli/aad/ node tools/site/aad-m29-primary-studio-browser-smoke.mjs
          AAD_M30_PROJECT_URL=http://127.0.0.1:5191/JP_Computer-Aided-Drawings/projects/narayani-parajuli/aad/ node tools/site/aad-m30-source-browser-smoke.mjs
          AAD_BUILDING_URL=http://127.0.0.1:5191/JP_Computer-Aided-Drawings/cad/aad/multistorey/ node tools/site/aad-building-browser-smoke.mjs
          CAD_AAD_TEMPLATE_URL=http://127.0.0.1:5191/JP_Computer-Aided-Drawings/cad/aad/ node tools/site/aad-selection-sync-smoke.mjs
          CAD_AAD_TEMPLATE_URL=http://127.0.0.1:5191/JP_Computer-Aided-Drawings/cad/aad/ node tools/site/aad-topology-browser-smoke.mjs
          AAD_AI_DEMO_URL=http://127.0.0.1:5191/JP_Computer-Aided-Drawings/projects/aad-ai-demo/aad/ node tools/site/aad-ai-demo-browser-smoke.mjs
          ASHOK_URL=http://127.0.0.1:5191/JP_Computer-Aided-Drawings/projects/ashok-adhikari/ node tools/site/ashok-rev04-browser.mjs
          node tools/site/ashok-usability-browser.mjs
          node tools/site/aad-code-library-browser.mjs
      - name: Save render verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-pages-prepublish-render-proof
          path: |
            /tmp/cad-aad-daylight-*.png
            /tmp/cad-aad-narayani-dxf.png
            /tmp/aad-m26-main-studio-source-structural.png
            /tmp/aad-m29-dxf-datum-and-upper-floor-evidence.png
            /tmp/aad-m30-source-native-upper-floors.png
            /tmp/cad-aad-building-*.png
            /tmp/cad-aad-shared-highlight-selection.png
            /tmp/cad-aad-topology-3way-ui.png
            /tmp/cad-aad-ai-new-project.png
            /tmp/ashok-rev04-*.png
            /tmp/ashok-qa02-*.png
            /tmp/ashok-roof-access-*.png
            /tmp/ashok-headroom-*.json
            /tmp/cad-code-library-*.png
            /tmp/cad-memory-wall-*.png
          if-no-files-found: ignore
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install pinned geometry engines for Pages build
        run: python -m pip install -r backend/requirements.txt
      - name: Independently validate IFC4 round-trip before publication
        run: python tools/site/aad-ifc-independent-check.py
      - name: Independently parse generated synthetic IFC4 package
        run: python tools/site/aad-ai-independent-ifc.py public/data/projects/aad-ai-demo/AAD-DEMO-001_AAD_CONCEPTUAL_2STOREY_IFC4.ifc 2
      - name: GitHub-hosted machine generates synthetic demo plan and IFC/STEP/DXF
        run: |
          python -m unittest backend.tests.test_design_machine -v
          python -m backend.cad_bridge.design_cli --job design_jobs/synthetic/m08_demo.job.json --repo-root . --out dist/cad/jobs/m08-demo
          python tools/site/cad-m08-verify.py --out dist/cad/jobs/m08-demo --job design_jobs/synthetic/m08_demo.job.json
          test -s dist/cad/jobs/m08-demo/index.html
          test -s dist/cad/jobs/m08-demo/manifest.json
          echo "M08_PAGES_MACHINE_GENERATED_SOURCE_HASH_QA_PASS"
      - run: |
          test -s dist/cad/index.html
          test -s dist/cad/demo.json
          test -s dist/cad/web-ifc.wasm
          echo "FIVE_ENGINE_BROWSER_PUBLICATION_GATE_PASS"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
  deploy:
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
