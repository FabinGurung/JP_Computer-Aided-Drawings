name: Validate Narayani + Open Architecture overlay

on:
  push:
    branches:
      - narayani-modular-website-v0.3
    paths:
      - ".github/workflows/research-pages-overlay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical publication branch
        uses: actions/checkout@v4
        with:
          ref: narayani-modular-website-v0.3

      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/open-architecture-engine-v0.1
          path: _research_source

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate research artifacts from canonical model
        run: python _research_source/tools/open_architecture/generate_poc.py

      - name: Assemble validation artifact without publishing
        run: |
          mkdir -p _site
          cp index.html 404.html MANIFEST.json .nojekyll _site/
          cp -R assets data stages _site/
          mkdir -p _site/research/open-architecture-engine-v0.1
          cp -R _research_source/public/research/open-architecture-engine-v0.1/. _site/research/open-architecture-engine-v0.1/

      - name: Verify preserved root and research overlay
        run: |
          test -f _site/index.html
          test -d _site/stages
          test -f _site/research/open-architecture-engine-v0.1/index.html
          test -f _site/research/open-architecture-engine-v0.1/plan.svg
          test -f _site/research/open-architecture-engine-v0.1/plan.dxf
          test -f _site/research/open-architecture-engine-v0.1/model.gltf
          python -m json.tool _site/research/open-architecture-engine-v0.1/model.gltf >/dev/null
          echo "OVERLAY_QA=PASS"
          echo "Production Pages remains owned by the configured narayani-modular-website-v0.3 branch source."

      - name: Upload validation artifact only
        uses: actions/upload-artifact@v4
        with:
          name: narayani-open-architecture-overlay-validation
          path: _site
