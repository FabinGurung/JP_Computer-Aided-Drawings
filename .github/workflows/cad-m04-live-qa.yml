name: CAD M04 Public DXF Review Browser Acceptance
on:
  push:
    branches: [main]
    paths: [.github/workflows/cad-m04-live-qa.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  public-dxf-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "npm"}
      - name: Wait for published M04 source review controls
        run: |
          set -euo pipefail
          url="https://fabingurung.github.io/JP_Computer-Aided-Drawings/cad/"
          for i in $(seq 1 24); do
            if curl --max-time 15 -fsSL "$url" -o /tmp/cad.html &&
               grep -q 'CAD Studio · M04' /tmp/cad.html &&
               grep -q 'id="loadDxfReview"' /tmp/cad.html;then break;fi
            echo "Waiting for Pages publish $i"
            sleep 5
          done
          grep -q 'id="loadDxfReview"' /tmp/cad.html
          echo CAD_M04_PUBLIC_ROUTE_PASS
      - name: Test deployed Three.js native DXF overlay interactions
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          CAD_M04_URL=https://fabingurung.github.io/JP_Computer-Aided-Drawings/cad/ node tools/site/cad-m04-smoke.mjs
