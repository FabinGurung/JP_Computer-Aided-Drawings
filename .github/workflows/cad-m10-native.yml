name: CAD M10.1 Oriented Connected Walls Native QA
on:
  pull_request:
    paths:
      - "backend/cad_bridge/oriented_*.py"
      - "backend/tests/test_oriented_geometry.py"
      - "design_jobs/synthetic/m10_*.json"
      - "cad/M10_1_CONNECTED_ORIENTED_WALLS.md"
      - ".github/workflows/cad-m10-native.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cad-m10-connected-walls-native
  cancel-in-progress: false
jobs:
  oriented-connected-wall-native:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native CAD engines
        run: python -m pip install -r backend/requirements.txt
      - name: M10 native U-wall, IFC/STEP/DXF geometry and rejection tests
        run: python -m unittest backend.tests.test_oriented_geometry -v
      - name: M09.1 and M09.2 governance regressions
        run: python -m unittest backend.tests.test_governed_job backend.tests.test_source_bundle -v
      - name: Execute controlled synthetic M10 native machine
        run: |
          python -m backend.cad_bridge.oriented_cli \
            --preset synthetic-u-walls --repo-root . --out /tmp/cad-m10-evidence
      - name: Independently verify source SHA, output digests and engineering hold
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          path = pathlib.Path("/tmp/cad-m10-evidence")
          source = pathlib.Path("design_jobs/synthetic/m10_demo.source.json")
          manifest = json.loads((path / "manifest.json").read_text())
          assert manifest["source_sha256"] == hashlib.sha256(source.read_bytes()).hexdigest()
          assert manifest["schema"] == "fabin-cad://oriented-design-result/0.1"
          assert (manifest["walls"], manifest["joints"], manifest["openings"]) == (3, 2, 1)
          assert manifest["engineering_approval"] == "HOLD"
          assert manifest["quantity_takeoff"] == "BLOCKED"
          assert manifest["private_execution_enabled"] is False
          assert manifest["exact_section_export"] == "NOT_IMPLEMENTED"
          assert len(manifest["outputs"]) == 6
          for item in manifest["outputs"]:
              f = path / item["name"]
              assert f.is_file() and len(f.read_bytes()) == item["bytes"]
              assert hashlib.sha256(f.read_bytes()).hexdigest() == item["sha256"]
          graph = json.loads((path / "connectivity.json").read_text())
          assert len(graph["walls"]) == 3 and len(graph["joints"]) == 2
          assert sorted([w["yaw_deg"] for w in graph["walls"]]) == [0, 90, 180]
          assert graph["engineering_approval"] == "HOLD"
          print("M10_ORIENTED_NATIVE_SOURCE_GEOMETRY_READBACK_PASS")
          PY
      - name: Preserve time-limited nonproduction evidence, never publish client data
        uses: actions/upload-artifact@v4
        with:
          name: m10-1-synthetic-native-wall-network
          path: /tmp/cad-m10-evidence/
          retention-days: 14
          if-no-files-found: error
