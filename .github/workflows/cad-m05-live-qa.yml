name: CAD M05 Published Semantic Source Review Acceptance
on:
  push:
    branches: [main]
    paths: [.github/workflows/cad-m05-live-qa.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  public-semantic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "npm"}
      - name: Wait for M05 public CAD release
        run: |
          set -euo pipefail
          url="https://fabingurung.github.io/JP_Computer-Aided-Drawings/cad/"
          for i in $(seq 1 30); do
            if curl --max-time 15 -fsSL "$url" -o /tmp/cad.html &&
               grep -q 'CAD Studio · M05' /tmp/cad.html &&
               grep -q 'id="loadSemanticReview"' /tmp/cad.html;then break;fi
            echo "Waiting for Pages M05 publish $i"
            sleep 5
          done
          grep -q 'id="loadSemanticReview"' /tmp/cad.html
          echo CAD_M05_PUBLIC_ROUTE_PASS
      - name: Test public Three.js 2D semantic review with WebGL
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          CAD_M05_URL=https://fabingurung.github.io/JP_Computer-Aided-Drawings/cad/ node tools/site/cad-m05-smoke.mjs
