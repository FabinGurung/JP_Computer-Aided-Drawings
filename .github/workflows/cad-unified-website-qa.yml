name: CAD Unified Website Staging QA
on:
  push:
    branches:
      - feature/unified-main-website-20261009
      - main
  pull_request:
    paths:
      - "index.html"
      - "src/main.ts"
      - "vite.config.ts"
      - "public/**"
      - "tools/site/**"
      - ".github/workflows/cad-unified-website-qa.yml"
permissions:
  contents: read
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "npm"}
      - run: npm ci
      - run: npm run typecheck
      - name: Ashok REV04 source admission and architecture-only template QA
        run: |
          node tools/site/ashok-rev04-smoke.mjs
          python tools/site/aad-build-code-register.py
          git diff --exit-code -- public/data/codes/nepal-pokhara.json
          node tools/site/aad-code-document-smoke.mjs
          python tools/site/ashok-build-coordinated.py
          git diff --exit-code -- 'public/data/projects/ashok-adhikari/*qa02.json'
          node tools/site/ashok-qa02-smoke.mjs
          node tools/site/ashok-v2-services-smoke.mjs
          node tools/site/ashok-qa02-ifc.mjs
      - name: Validate Narayani DXF provenance and three-floor AAD project payload
        run: node tools/site/aad-narayani-source-smoke.mjs
      - name: Verify GitHub Pages base build and static routes
        run: |
          npm run build -- --base=/JP_Computer-Aided-Drawings/
          python tools/site/check_public_routes.py dist
      - name: Verify Ashok working project in mobile, tablet and desktop browsers
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          (npm run preview -- --host 127.0.0.1 --port 5191 --base=/JP_Computer-Aided-Drawings/ > /tmp/ashok-preview.log 2>&1 &)
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:5191/JP_Computer-Aided-Drawings/projects/ashok-adhikari/ >/dev/null && break; sleep 2; done
          node tools/site/ashok-rev04-browser.mjs
          node tools/site/ashok-usability-browser.mjs
          node tools/site/aad-code-library-browser.mjs
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify frozen research generators
        run: |
          python tools/open_architecture/generate_poc.py
          python tools/open_architecture/generate_v02.py --acceptance-check
          git diff --exit-code -- public/research/open-architecture-engine-v0.1 public/research/open-architecture-engine-v0.2
      - uses: actions/upload-artifact@v4
        with:
          name: cad-unified-site-staging
          path: dist
