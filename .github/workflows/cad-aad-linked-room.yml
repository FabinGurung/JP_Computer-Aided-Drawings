name: CAD AAD Linked 2D-3D Room Product
on:
  pull_request:
    paths:
      - "cad/aad/**"
      - "cad/index.html"
      - "index.html"
      - "vite.config.ts"
      - "tools/site/cad-aad-linked-smoke.mjs"
      - "tools/site/aad-narayani-source-smoke.mjs"
      - "tools/site/aad-narayani-browser-smoke.mjs"
      - "tools/site/aad-building-build.mjs"
      - "tools/site/aad-ifc-independent-check.py"
      - "tools/site/aad-building-browser-smoke.mjs"
      - "public/data/projects/narayani-parajuli/**"
      - "public/projects/narayani-parajuli/aad/**"
      - "tools/site/check_public_routes.py"
      - ".github/workflows/cad-aad-linked-room.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cad-aad-linked-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linked-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Strict TypeScript build and production static route QA
        run: |
          npm run build -- --base=/JP_Computer-Aided-Drawings/
          python tools/site/check_public_routes.py dist
          node tools/site/aad-building-build.mjs
          test -s dist/cad/aad/multistorey/index.html
          test -s dist/data/projects/narayani-parajuli/PRJ-000007_AAD_CONCEPTUAL_3STOREY_IFC4.ifc
          test -s dist/cad/aad/index.html
          echo CAD_AAD_LINKED_PRODUCTION_BUILD_PASS
      - name: Browser acceptance of actual 2D/3D and parameter propagation
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
          (npm run dev -- --host 127.0.0.1 --port 5175 > /tmp/cad-aad-vite.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5175/cad/aad/ >/dev/null && break;sleep 2;done
          CAD_AAD_URL=http://127.0.0.1:5175/cad/aad/ node tools/site/cad-aad-linked-smoke.mjs
          node tools/site/aad-narayani-source-smoke.mjs # project viewer asset test; browser route exercised against built Pages base
          echo CAD_AAD_BROWSER_LINKED_MODEL_PASS
      - name: Verify visible models at built GitHub Pages base path
        run: |
          (npm run preview -- --host 127.0.0.1 --port 5192 --base=/JP_Computer-Aided-Drawings/ > /tmp/cad-aad-prepublish.log 2>&1 &)
          for i in $(seq 1 35); do curl -fsS http://127.0.0.1:5192/JP_Computer-Aided-Drawings/cad/aad/ >/dev/null && break; sleep 2; done
          CAD_AAD_URL=http://127.0.0.1:5192/JP_Computer-Aided-Drawings/cad/aad/ node tools/site/cad-aad-linked-smoke.mjs
          AAD_PROJECT_URL=http://127.0.0.1:5192/JP_Computer-Aided-Drawings/projects/narayani-parajuli/aad/ node tools/site/aad-narayani-browser-smoke.mjs
          AAD_BUILDING_URL=http://127.0.0.1:5192/JP_Computer-Aided-Drawings/cad/aad/multistorey/ node tools/site/aad-building-browser-smoke.mjs
          echo CAD_AAD_PAGES_BASE_RENDER_VERIFIED
      - name: Independent IFC4 parsing and spatial graph round-trip (IfcOpenShell)
        run: |
          python -m pip install ifcopenshell==0.8.4.post1
          python tools/site/aad-ifc-independent-check.py
      - name: Save real render screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-aad-daylight-browser-screenshots
          path: |
            /tmp/cad-aad-daylight-*.png
            /tmp/cad-aad-narayani-dxf.png
            /tmp/cad-aad-building-*.png
          if-no-files-found: ignore
