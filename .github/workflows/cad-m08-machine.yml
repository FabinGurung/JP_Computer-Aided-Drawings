name: CAD M08 Deterministic Design Machine
on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Allowlisted design job; no arbitrary input URLs or execution"
        required: true
        type: choice
        default: synthetic-building
        options:
          - synthetic-building
  pull_request:
    paths:
      - "backend/cad_bridge/design_*.py"
      - "backend/tests/test_design_machine.py"
      - "design_jobs/synthetic/**"
      - "tools/site/cad-m08-*.py"
      - ".github/workflows/cad-m08-machine.yml"
permissions:
  contents: read
concurrency:
  group: cad-m08-review-${{ github.ref }}-${{ github.event.inputs.preset || 'pull-request' }}
  cancel-in-progress: false
jobs:
  deterministic-design:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Use only approved synthetic GitHub job
        run: |
          case "${{ inputs.preset || 'synthetic-building' }}" in
            synthetic-building) echo "JOB_PATH=design_jobs/synthetic/m08_demo.job.json" >> "$GITHUB_ENV";;
            *) echo "Unrecognized preset" >&2; exit 2;;
          esac
      - name: Install five-engine backend
        run: python -m pip install -r backend/requirements.txt
      - name: Full geometry and validation tests
        run: python -m unittest discover -s backend/tests -v
      - name: Execute reproducible M08 design job
        run: python -m backend.cad_bridge.design_cli --job "$JOB_PATH" --repo-root . --out /tmp/cad-m08-reviews
      - name: Independent artifact SHA-256 / source read-back
        run: python tools/site/cad-m08-verify.py --out /tmp/cad-m08-reviews --job "$JOB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build browser CAD app without unverified content
        run: |
          npm ci
          npm run build -- --base=/JP_Computer-Aided-Drawings/
      - name: Browser WebIFC and Three.js import acceptance
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          (npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/cad-m08-vite.log 2>&1 &)
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:5174/cad/ >/dev/null && break; sleep 2; done
          M08_CAD_URL=http://127.0.0.1:5174/cad/ node tools/site/cad-m08-browser.mjs
      - name: Store draft outputs as nonproduction Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: m08-synthetic-design-review
          path: /tmp/cad-m08-reviews/
          retention-days: 14
          if-no-files-found: error
