name: CAD M04 DXF Native Review Acceptance
on:
  push:
    branches: [feature/cad-m04-dxf-review-overlay-20261009]
  pull_request:
    paths: ["cad/**","backend/**","tools/site/cad-m04-smoke.mjs",".github/workflows/cad-m04-qa.yml"]
permissions:
  contents: read
jobs:
  five-engine-native-dxf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -v
  live-browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "npm"}
      - run: npm ci
      - run: npm run build -- --base=/JP_Computer-Aided-Drawings/
      - run: python tools/site/check_public_routes.py dist
      - name: Real WebGL isolation and import review
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          (npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/cad-m04-server.log 2>&1 &)
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:5174/cad/ >/dev/null && break;sleep 2;done
          CAD_M04_URL=http://127.0.0.1:5174/cad/ node tools/site/cad-m04-smoke.mjs
