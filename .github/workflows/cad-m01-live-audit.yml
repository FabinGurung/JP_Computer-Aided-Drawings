name: CAD M01 Live Pages Readback
on:
  push:
    branches: [main]
    paths: [.github/workflows/cad-m01-live-audit.yml]
  pull_request:
    paths: [.github/workflows/cad-m01-live-audit.yml]
  workflow_run:
    workflows: ["CAD Main GitHub Pages (validated CAD publishing)"]
    types: [completed]
permissions: {contents: read}
jobs:
  live-readback:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployed CAD routes and real assets without writing
        run: |
          set -euo pipefail
          BASE="https://fabingurung.github.io/JP_Computer-Aided-Drawings/"
          for attempt in $(seq 1 12); do
            if curl --max-time 15 -fsSL "${BASE}cad/" -o /tmp/cad-live.html &&
               grep -q 'OPEN ARCHITECTURE' /tmp/cad-live.html; then break; fi
            echo "Propagation wait: $attempt";sleep 10
          done
          grep -q 'Open Architecture' /tmp/cad-live.html
          curl -fsSL "${BASE}" -o /tmp/cad-root.html
          grep -q 'How It Works' /tmp/cad-root.html
          grep -q 'href="./cad/brief/"' /tmp/cad-root.html
          grep -q 'href="./cad/"' /tmp/cad-root.html
          curl -fsSL "${BASE}guide/" -o /tmp/cad-guide.html
          grep -q 'AI-Aided Drawing' /tmp/cad-guide.html
          grep -q '07 · TRACE' /tmp/cad-guide.html
          curl -fsSL "${BASE}cad/brief/" -o /tmp/cad-brief.html
          grep -q 'AI-AIDED DRAWING' /tmp/cad-brief.html
          grep -q 'How It Works' /tmp/cad-brief.html
          curl -fsSL "${BASE}cad/demo.json" -o /tmp/cad-model.json
          python - <<'PY'
          import json
          m=json.load(open("/tmp/cad-model.json"))
          assert m["schema"]=="fabin-cad://canonical-boxes/0.1"
          assert m["authority"]=="DEMO_ONLY"
          assert len(m["elements"])>=8
          print("LIVE_CANONICAL_DEMO_PASS",len(m["elements"]))
          PY
          curl -fsSI "${BASE}cad/web-ifc.wasm" | head -n 8
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import urlopen
          class AssetParser(HTMLParser):
              def __init__(self):super().__init__();self.assets=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=="script" and d.get("src"):self.assets.append(d["src"])
          p=AssetParser();p.feed(open("/tmp/cad-live.html").read())
          assert p.assets, "No Vite application script found"
          for asset in p.assets:
              url=urljoin("https://fabingurung.github.io/JP_Computer-Aided-Drawings/cad/",asset)
              with urlopen(url,timeout=20) as response:
                  assert response.status==200
                  assert "javascript" in response.headers.get("Content-Type","") or url.endswith(".js")
              print("LIVE_CAD_SCRIPT_PASS",url)
          PY
          echo "CAD_M01_PUBLIC_LIVE_READBACK_PASS"

      - name: Independently read back canonical AAD, project adapter, shared model, and exported IFC4
        run: |
          set -euo pipefail
          BASE="https://fabingurung.github.io/JP_Computer-Aided-Drawings/"
          for attempt in $(seq 1 15); do
            if curl -fsSL --max-time 20 "${BASE}cad/aad/" -o /tmp/aad-template-live.html &&
               grep -q "Canonical AI-Aided Building Design Studio" /tmp/aad-template-live.html; then break; fi
            echo "AAD propagation: ${attempt}"; sleep 10
          done
          grep -q 'location.replace(target.href)' /tmp/aad-template-live.html
          curl -fsSL --max-time 25 "${BASE}cad/aad/multistorey/" -o /tmp/aad-live-studio.html
          grep -q 'id="viewer2d"' /tmp/aad-live-studio.html
          grep -q 'id="viewer3d"' /tmp/aad-live-studio.html
          grep -q 'id="elements"' /tmp/aad-live-studio.html
          grep -q 'id="aad-selected-summary"' /tmp/aad-live-studio.html
          curl -fsSL --max-time 25 "${BASE}projects/narayani-parajuli/aad/" -o /tmp/aad-live-narayani.html
          grep -q 'id="aad-unified-engine"' /tmp/aad-live-narayani.html
          test "$(grep -o '<iframe' /tmp/aad-live-narayani.html | wc -l | tr -d ' ')" -eq 1
          curl -fsSL --max-time 25 "${BASE}data/projects/narayani-parajuli/aad-building-v1.json" -o /tmp/aad-live-manifest.json
          curl -fsSL --max-time 25 "${BASE}data/projects/narayani-parajuli/PRJ-000007_AAD_CONCEPTUAL_3STOREY_IFC4.ifc" -o /tmp/aad-live-building.ifc
          curl -fsSL --max-time 25 "${BASE}assets/js/aad-unified-workspace.mjs" -o /tmp/aad-live-engine.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('/tmp/aad-live-manifest.json').read_text())
          assert manifest['schema']=='jp-cad://aad-building/1'
          assert manifest['projectId']=='PRJ-000007'
          assert manifest['structuralReview']['mode']=='OWNER_APPROVED_SOURCE_QA_GROUND_FLOOR_ONLY'
          assert manifest['structuralReview']['constructionApproval'] is False
          assert [r['id'] for r in manifest['levels']]==['gf','ff','sf']
          ifc=Path('/tmp/aad-live-building.ifc')
          assert ifc.stat().st_size>50000
          text=ifc.read_text()
          assert "FILE_SCHEMA(('IFC4'))" in text
          assert text.count('=IFCBUILDINGSTOREY(')==3
          assert text.count('=IFCCOLUMN(')==23, 'M27: live IFC columns differ from source-approved M26'
          assert text.count('=IFCFOOTING(')==21, 'M27: live IFC footings differ from original DXF'
          assert text.count('=IFCBEAM(')==16, 'M27: live IFC beams differ from frozen M70'
          assert text.count('=IFCRELVOIDSELEMENT(')==43
          assert text.count('=IFCRELFILLSELEMENT(')==43
          engine=Path('/tmp/aad-live-engine.mjs').read_text()
          assert 'createAADWorkspace' in engine and 'function snapshot()' in engine
          print('CAD_M27_NARAYANI_LIVE_23_21_16_IFC_READBACK_PASS',ifc.stat().st_size)
          PY

      - name: Verify generated AI-to-AAD project on live GitHub Pages
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 14); do
            if curl -fsSL --max-time 20 "https://fabingurung.github.io/JP_Computer-Aided-Drawings/projects/aad-ai-demo/aad/" -o /tmp/aad-ai-live-page.html &&
               grep -q 'id="aad-unified-engine"' /tmp/aad-ai-live-page.html; then break; fi
            sleep 10
          done
          grep -q 'id="aad-unified-engine"' /tmp/aad-ai-live-page.html
          curl -fsSL "https://fabingurung.github.io/JP_Computer-Aided-Drawings/data/projects/aad-ai-demo/aad-building-v1.json" -o /tmp/aad-ai-live-manifest.json
          curl -fsSL "https://fabingurung.github.io/JP_Computer-Aided-Drawings/data/projects/aad-ai-demo/aad-ai-qa.json" -o /tmp/aad-ai-live-qa.json
          curl -fsSL "https://fabingurung.github.io/JP_Computer-Aided-Drawings/data/projects/aad-ai-demo/AAD-DEMO-001_AAD_CONCEPTUAL_2STOREY_IFC4.ifc" -o /tmp/aad-ai-live-ifc.ifc
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/aad-ai-live-manifest.json').read_text())
          q=json.loads(Path('/tmp/aad-ai-live-qa.json').read_text())
          text=Path('/tmp/aad-ai-live-ifc.ifc').read_text()
          assert m['projectId']=='AAD-DEMO-001'
          assert len(m['levels'])==2
          assert [x['sourceArea'] for x in m['levels']]==[80,80]
          assert q['stage']=='AI_CONCEPTUAL_ENGINEERING_HOLD'
          assert q['explicitPublicApproval'] and not q['issueForConstruction']
          assert text.count('=IFCBUILDINGSTOREY(')==2
          assert text.count('=IFCRELVOIDSELEMENT(')==7
          assert text.count('=IFCRELFILLSELEMENT(')==7
          assert Path('/tmp/aad-ai-live-ifc.ifc').stat().st_size>15000
          print('AAD_AI_GENERATED_PROJECT_LIVE_READBACK_PASS')
          PY

      - name: Checkout exact M26 production revision for live browser parity
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install browser parity runner for real public Narayani studio
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Independently verify LIVE SVG Three.js component register and IFC4 from one source model
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        env:
          AAD_M26_PROJECT_URL: https://fabingurung.github.io/JP_Computer-Aided-Drawings/projects/narayani-parajuli/aad/
        run: |
          node tools/site/aad-m26-primary-studio-browser-smoke.mjs
          AAD_M29_PROJECT_URL="https://fabingurung.github.io/JP_Computer-Aided-Drawings/projects/narayani-parajuli/aad/" node tools/site/aad-m29-primary-studio-browser-smoke.mjs
      - name: Archive evidence screenshot of live M26 primary studio
        if: always() && github.event_name == 'workflow_run'
        uses: actions/upload-artifact@v4
        with:
          name: m27-live-primary-aad-2d-3d-ifc-parity
          path: |
            /tmp/aad-m26-main-studio-source-structural.png
            /tmp/aad-m29-dxf-datum-and-upper-floor-evidence.png
          if-no-files-found: ignore
      - name: Verify live Ashok route and shared model on phone tablet and desktop
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        env:
          ASHOK_URL: https://fabingurung.github.io/JP_Computer-Aided-Drawings/projects/ashok-adhikari/
        run: node tools/site/ashok-rev04-browser.mjs
      - name: Archive live Ashok working studio QA
        if: always() && github.event_name == 'workflow_run'
        uses: actions/upload-artifact@v4
        with:
          name: ashok-rev04-live-working-studio
          path: |
            /tmp/ashok-rev04-*.png
            /tmp/ashok-qa02-*.png
          if-no-files-found: ignore
