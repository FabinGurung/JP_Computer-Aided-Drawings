name: CAD M02 Parametric Geometry QA
on:
  push:
    branches: [feature/cad-m02-constraints-sections-20261009]
  pull_request:
    paths: ["cad/**","backend/**","public/cad/demo.json",".github/workflows/cad-m02-qa.yml"]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "npm"}
      - run: npm ci
      - run: npm run build -- --base=/JP_Computer-Aided-Drawings/
      - run: python tools/site/check_public_routes.py dist
      - run: test -f dist/cad/index.html && test -s dist/cad/web-ifc.wasm
  python-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -v
      - run: |
          mkdir -p /tmp/cad-m02
          python -m backend.cad_bridge.cli --format ifc --out /tmp/cad-m02/test.ifc
          python -m backend.cad_bridge.cli --format dxf --out /tmp/cad-m02/test.dxf
          python -m backend.cad_bridge.cli --format step --out /tmp/cad-m02/test.step
