name: CAD M02 Parametric Geometry QA
on:
  push:
    branches: [feature/cad-m02-constraints-sections-20261009]
  pull_request:
    paths: ["cad/**","backend/**","public/cad/demo.json",".github/workflows/cad-m02-qa.yml"]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "npm"}
      - run: npm ci
      - run: npm run build -- --base=/JP_Computer-Aided-Drawings/
      - run: python tools/site/check_public_routes.py dist
      - run: test -f dist/cad/index.html && test -s dist/cad/web-ifc.wasm
      - name: Live local browser interaction checks
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          (npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/cad-m02-vite.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5174/cad/ > /dev/null && break; sleep 2; done
          CAD_M02_URL=http://127.0.0.1:5174/cad/ node tools/site/cad-m02-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-m02-browser-qa
          path: /tmp/cad-m02-smoke.png
          if-no-files-found: ignore

  python-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -v
      - run: |
          mkdir -p /tmp/cad-m02
          python -m backend.cad_bridge.cli --format ifc --out /tmp/cad-m02/test.ifc
          python -m backend.cad_bridge.cli --format dxf --out /tmp/cad-m02/test.dxf
          python -m backend.cad_bridge.cli --format step --out /tmp/cad-m02/test.step
