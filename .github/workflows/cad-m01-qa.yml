name: CAD Five-Engine M01 Integration QA
on:
  push:
    branches: [feature/five-engine-cad-m01-20261009]
    paths: [package-lock.json, .github/workflows/cad-m01-qa.yml]
  pull_request:
    paths: [cad/**, backend/**, package.json, package-lock.json, scripts/copy-ifc-wasm.mjs, vite.config.ts, tsconfig.json, .github/workflows/cad-m01-qa.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "npm"}
      - run: npm ci
      - run: npm run build -- --base=/JP_Computer-Aided-Drawings/
      - name: Verify browser page and WASM asset
        run: |
          test -f dist/cad/index.html
          test -s dist/cad/web-ifc.wasm
          test -f dist/cad/demo.json
          test -f dist/projects/narayani-parajuli/index.html
          python tools/site/check_public_routes.py dist
          echo CAD_BROWSER_BUILD_PASS
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install real Python engines
        run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -v
      - name: Run all output paths
        run: |
          mkdir -p /tmp/cad-m01
          python -m backend.cad_bridge.cli --format dxf --out /tmp/cad-m01/demo.dxf
          python -m backend.cad_bridge.cli --format ifc --out /tmp/cad-m01/demo.ifc
          python -m backend.cad_bridge.cli --format step --out /tmp/cad-m01/demo.step
          python -m backend.cad_bridge.cli --format section --section-z-mm 1000
          test -s /tmp/cad-m01/demo.dxf
          test -s /tmp/cad-m01/demo.ifc
          test -s /tmp/cad-m01/demo.step
          echo CAD_3_PYTHON_ENGINES_PASS
