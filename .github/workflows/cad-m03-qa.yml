name: CAD M03 Reusable Project Input QA
on:
  push:
    branches: [feature/cad-m03-project-packages-20261009]
  pull_request:
    paths: ["cad/**","backend/**","public/cad/**","tools/site/cad-m03-smoke.mjs",".github/workflows/cad-m03-qa.yml"]
permissions:
  contents: read
jobs:
  browser-package:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "npm"}
      - run: npm ci
      - run: npm run build -- --base=/JP_Computer-Aided-Drawings/
      - run: python tools/site/check_public_routes.py dist
      - name: Live local create-edit-export-import and rejection QA
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          (npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/cad-m03-vite.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5174/cad/ >/dev/null && break; sleep 2; done
          CAD_M03_URL=http://127.0.0.1:5174/cad/ node tools/site/cad-m03-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-m03-project-browser
          path: /tmp/cad-m03-template-browser.png
          if-no-files-found: ignore
  python-package:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -v
