name: CAD M12.1 Conversational Intake and DXF Source Boundaries
on:
  pull_request:
    paths:
      - "backend/cad_bridge/dxf_inventory.py"
      - "backend/cad_bridge/conversation_contract.py"
      - "backend/tests/test_m12_conversational_intake.py"
      - "cad/brief/**"
      - "cad/index.html"
      - "vite.config.ts"
      - "tools/site/check_public_routes.py"
      - "cad/M12_1_CONVERSATION_SOURCE_GATES.md"
      - ".github/workflows/cad-m12-1-intake.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cad-m12-1-intake-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-intake-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin native CAD libraries
        run: python -m pip install -r backend/requirements.txt
      - name: Verify source hash, DXF revision safety, language evidence and missing data
        run: |
          python -m unittest backend.tests.test_m12_conversational_intake -v
          python -m unittest backend.tests.test_dxf_intake -v
      - name: Preserve previous source and geometric acceptance
        run: |
          python -m unittest backend.tests.test_assembly_multilevel backend.tests.test_assembly_engine backend.tests.test_angled_network -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck and compile the language-first 3D route
        run: npm run build -- --base=/JP_Computer-Aided-Drawings/
      - name: Verify route and immutable legacy pages
        run: |
          python tools/site/check_public_routes.py dist
          test -s dist/cad/brief/index.html
          test -s dist/cad/index.html
          echo "CAD_M12_1_CONVERSATION_SOURCE_AND_3D_QA_PASS"
